name: Build OrangeFox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python-is-python3 \
            make bc bison flex zip unzip \
            libssl-dev libncurses5 lzop \
            pngcrush schedtool rsync \
            openjdk-11-jdk ccache

      - name: Setup repo tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Sync OrangeFox Sources
        run: |
          mkdir ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

      - name: Clone Device Tree
        run: |
          cd ~/fox_12.1
          git clone https://github.com/Zeadzezoqww/recovery_device_xiaomi_tanzanite \
            device/xiaomi/tanzanite --depth=1

      - name: Build OrangeFox
        run: |
          cd ~/fox_12.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=tanzanite
          export LC_ALL=C
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export OF_DEFAULT_KEYMASTER_VERSION=4.1
          export OF_FORCE_PREBUILT_KERNEL=1
          source build/envsetup.sh
          lunch twrp_tanzanite-eng
          mka adbd vendorbootimage -j2

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: OrangeFox-tanzanite
          path: |
            ~/fox_12.1/out/target/product/tanzanite/OrangeFox*.img
            ~/fox_12.1/out/target/product/tanzanite/OrangeFox*.zip
            ~/fox_12.1/out/target/product/tanzanite/vendor_boot*.img
      - name: Sync OrangeFox Sources
        run: |
          mkdir ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

      - name: Clone Device Tree
        run: |
          cd ~/fox_12.1
          git clone https://github.com/Zeadzezoqww/recovery_device_xiaomi_tanzanite \
            device/xiaomi/tanzanite --depth=1

      - name: Build OrangeFox
        run: |
          cd ~/fox_12.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=tanzanite
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_tanzanite-eng
          mka adbd recoveryimage -j2

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: OrangeFox-tanzanite
          path: |
            ~/fox_12.1/out/target/product/tanzanite/OrangeFox*.img
            ~/fox_12.1/out/target/product/tanzanite/OrangeFox*.zip
