name: Build OrangeFox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python-is-python3 \
            make bc bison flex zip unzip \
            libssl-dev libncurses-dev libtinfo6 libncurses6 lzop \
            pngcrush schedtool rsync \
            openjdk-11-jdk ccache \
            android-sdk-libsparse-utils || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: Setup repo tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Sync OrangeFox Sources
        run: |
          mkdir ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

      - name: Clone Device Tree
        run: |
          cd ~/fox_12.1
          git clone https://github.com/Zeadzezoqww/recovery_device_xiaomi_tanzanite \
            device/xiaomi/tanzanite --depth=1

      - name: Clone Vendor
        run: |
          cd ~/fox_12.1
          git clone https://github.com/Zeadzezoqww/proprietary_vendor_xiaomi_tanzanite \
            vendor/xiaomi/tanzanite --depth=1

      - name: Build OrangeFox
        run: |
          cd ~/fox_12.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=tanzanite
          export LC_ALL=C
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export OF_DEFAULT_KEYMASTER_VERSION=4.1
          export OF_FORCE_PREBUILT_KERNEL=1
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 5G
          source build/envsetup.sh
          lunch twrp_tanzanite-eng
          mka adbd vendorbootimage -j2

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite
          path: |
            ~/fox_12.1/out/target/product/tanzanite/OrangeFox*.img
            ~/fox_12.1/out/target/product/tanzanite/OrangeFox*.zip
            ~/fox_12.1/out/target/product/tanzanite/vendor_boot*.img

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/fox_12.1/build.log
